<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>OutfitMaker</title>
  <defs>
    <clipPath id="tile">
      <rect x="4" y="4" width="52" height="52" rx="14"/>
    </clipPath>
  </defs>

  <!-- sombra dura sin blur, igual que la variable pop del CSS -->
  <rect x="8" y="8" width="52" height="52" rx="14" fill="#3a2b52"/>

  <!-- sticker con el cuadrillé amarillo de Cher -->
  <rect x="4" y="4" width="52" height="52" rx="14" fill="#ffe27a"/>
  <g clip-path="url(#tile)">
    <g fill="#3a2b52" opacity="0.13">
      <rect x="16" y="0" width="8" height="64"/>
      <rect x="38" y="0" width="8" height="64"/>
      <rect x="0" y="16" width="64" height="8"/>
      <rect x="0" y="38" width="64" height="8"/>
    </g>
    <g stroke="#ff5fa2" stroke-width="1.6" opacity="0.7">
      <path d="M31 0V64M53 0V64M9 0V64"/>
      <path d="M0 31H64M0 53H64M0 9H64"/>
    </g>
  </g>
  <rect x="4" y="4" width="52" height="52" rx="14" fill="none" stroke="#3a2b52" stroke-width="3"/>

  <!-- la percha -->
  <path d="M30 26 L11 43 Q9 46 12.5 46 H47.5 Q51 46 49 43 Z"
        fill="#fffdf6" stroke="#3a2b52" stroke-width="4" stroke-linejoin="round"/>
  <path d="M30 26 V23.5 C30 21 35 20.5 35 16.5 A5 5 0 0 0 25 16.5"
        fill="none" stroke="#3a2b52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- el ✧ del título -->
  <path d="M50 2 Q51.3 10.7 60 12 Q51.3 13.3 50 22 Q48.7 13.3 40 12 Q48.7 10.7 50 2 Z"
        fill="#ff5fa2" stroke="#3a2b52" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
